/* ===== TOOSH MOVIE — ticket / poster-print design ===== */
html{scroll-behavior:smooth}
[class*="shadow-"]:not(.bg-black *){box-shadow:4px 4px 0 var(--ink)}
.shadow-sm:not(.bg-black *),.shadow-md:not(.bg-black *){box-shadow:2px 2px 0 var(--ink)}
[class*="backdrop-blur"]:not(.bg-black *){-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.7px);background-size:16px 16px;background-attachment:fixed;color:var(--text)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:0}
::selection{background:var(--accent);color:#000}
.rounded-xl:not(.bg-black *),.rounded-2xl:not(.bg-black *),.rounded-3xl:not(.bg-black *),.rounded-\[26px\]:not(.bg-black *){border-radius:8px!important}
button.rounded-full:not(.bg-black *),input.rounded-full{border-radius:8px!important}

/* header */
header.fixed{background:var(--header-bg)!important;border-bottom:3px solid var(--ink)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
header .font-black.text-2xl{font-family:var(--font-serif);font-size:1.7rem;font-weight:400;letter-spacing:.06em;line-height:1;padding:.14rem .5rem .04rem;background:var(--primary)!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;-webkit-text-fill-color:#fff!important;color:#fff!important;filter:none!important;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);transition:transform .2s}
header .font-black.text-2xl:hover{transform:rotate(2deg) scale(1.06)}
header .font-black.text-2xl+span{margin-top:6px!important}
header input{border-radius:8px!important;background:var(--surface)!important;border:2px solid var(--ink)!important;box-shadow:3px 3px 0 var(--ink);color:var(--text)!important;transition:box-shadow .15s}
header input:focus{box-shadow:5px 5px 0 var(--primary)}
header .relative.shrink-0>button{border-radius:8px!important;border:2px solid var(--ink)!important;box-shadow:3px 3px 0 var(--ink);background:var(--surface)!important}
header .absolute.left-0.mt-2{border:3px solid var(--ink)!important;border-radius:10px!important;box-shadow:6px 6px 0 var(--ink);background:var(--surface-solid)!important}

/* tabs */
.sticky.top-16{background:var(--bg)!important;border-bottom:2px solid var(--ink)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
.sticky.top-16 button{background:var(--surface)!important;color:var(--text)!important;border:2px solid var(--ink)!important;border-radius:8px!important;box-shadow:3px 3px 0 var(--ink)!important;padding:.5rem 1rem!important;transition:transform .12s,box-shadow .12s}
.sticky.top-16 button[style*="--tm-fill"]{background:var(--primary)!important;color:#fff!important}
.sticky.top-16 button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)!important}

/* flat primary-filled buttons */
body button[style*="--tm-fill"]:not(.bg-black *){border:2px solid var(--ink)!important;box-shadow:4px 4px 0 var(--ink)!important;color:#fff!important;border-radius:8px!important;transition:transform .12s,box-shadow .12s}
body button[style*="--tm-fill"]:not(.bg-black *):active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)!important}

/* small pill buttons */
main button.rounded-full{border:2px solid var(--ink)!important;box-shadow:2px 2px 0 var(--ink);border-radius:6px!important}

main button.border.rounded-2xl{border:2px solid var(--ink)!important;box-shadow:4px 4px 0 var(--ink)}
/* panels */
.rounded-3xl.border:not(.tm-hero){border:2px solid var(--ink)!important;box-shadow:5px 5px 0 var(--ink)}

/* section titles = stickers */
h2.font-extrabold{font-family:var(--font-display);font-weight:400;font-size:1.3rem;letter-spacing:0;font-synthesis:none}
h2.font-extrabold>span.w-1{display:none}
h2.font-extrabold>span:last-child{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top;background:var(--primary);color:#fff;padding:.02em .6em .08em;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.2deg)}

/* poster cards */
.group.rounded-2xl.cursor-pointer.flex-col{border:2px solid var(--ink)!important;background:var(--surface)!important;box-shadow:5px 5px 0 var(--ink);transition:transform .15s ease,box-shadow .15s ease!important;animation:tmPop .55s cubic-bezier(.2,.9,.3,1.2) backwards}
.group.rounded-2xl.cursor-pointer.flex-col>div:last-child{border-top:2px dashed var(--ink);background:var(--surface-2)}
.group.rounded-2xl.cursor-pointer.flex-col img{filter:saturate(.85) contrast(1.06);transition:filter .3s,transform .4s}
.group.rounded-2xl.cursor-pointer.flex-col .absolute.top-2.right-2{background:var(--accent)!important;color:#000!important;border:2px solid #000!important;border-radius:4px!important;font-weight:900;transform:rotate(3deg)}
.group.rounded-2xl.cursor-pointer.flex-col .absolute.top-2.left-2{background:var(--primary)!important;color:#fff!important;border:2px solid #000!important;border-radius:4px!important;font-weight:900;transform:rotate(-3deg)}
.group.rounded-2xl.cursor-pointer.flex-col .absolute.bottom-2.left-2{border:2px solid #000!important;border-radius:4px!important;transform:rotate(-4deg)}
@media (hover:hover){
 .group.rounded-2xl.cursor-pointer.flex-col:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:9px 9px 0 var(--primary)}
 .group.rounded-2xl.cursor-pointer.flex-col:hover img{filter:saturate(1.2) contrast(1.06);transform:scale(1.05)}
}
.group.rounded-2xl.cursor-pointer.flex-col:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.group.rounded-2xl.cursor-pointer.flex-col:nth-child(2){animation-delay:.05s}.group.rounded-2xl.cursor-pointer.flex-col:nth-child(3){animation-delay:.1s}.group.rounded-2xl.cursor-pointer.flex-col:nth-child(4){animation-delay:.15s}.group.rounded-2xl.cursor-pointer.flex-col:nth-child(5){animation-delay:.2s}.group.rounded-2xl.cursor-pointer.flex-col:nth-child(6){animation-delay:.25s}.group.rounded-2xl.cursor-pointer.flex-col:nth-child(n+7){animation-delay:.3s}
.skeleton-shimmer{border-radius:8px!important;border:2px solid var(--border-strong)!important}
.rounded-full.overflow-hidden.border-2{border:3px solid var(--ink)!important;box-shadow:3px 3px 0 var(--ink)}

/* motion */
@keyframes tmPop{from{opacity:0;transform:translateY(22px) rotate(2.5deg) scale(.95)}to{opacity:1;transform:none}}
@keyframes tmDrop{from{opacity:0;transform:translateY(-26px) rotate(-1.5deg)}to{opacity:1;transform:none}}
@keyframes tmWobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg) translateY(-5px)}}
@keyframes tmMarq{to{transform:translateX(-50%)}}
@keyframes tmRise{from{opacity:0;transform:translateY(44px)}to{opacity:1;transform:none}}
@supports (animation-timeline:view()){main section:not(.tm-hero){animation:tmRise linear both;animation-timeline:view();animation-range:entry 0% entry 40%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* splash */
.blur-\[90px\],.absolute.inset-5.blur-md,.orbit-ring-1,.orbit-ring-2{display:none}
.float-logo{border-radius:10px!important;border:3px solid var(--ink)!important;background:var(--primary)!important;box-shadow:7px 7px 0 var(--ink)!important;animation:tmWobble 3s ease-in-out infinite!important}
h1.text-3xl{background:none!important;-webkit-text-fill-color:var(--text)!important;color:var(--text);text-shadow:3px 3px 0 var(--primary);font-size:min(2.3rem,7.2vw);line-height:1.1;font-weight:400;letter-spacing:.08em!important;white-space:nowrap;direction:ltr}

/* hero = cinema ticket */
.tm-hero{position:relative;display:flex;flex-wrap:wrap;background-color:var(--primary);background-image:radial-gradient(rgba(0,0,0,.18) 1.4px,transparent 1.9px);background-size:10px 10px;color:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--ink);overflow:hidden;animation:tmDrop .7s cubic-bezier(.2,.9,.3,1.1) backwards}
.tm-hero-main{flex:1 1 220px;padding:22px 18px 18px;min-width:0}
.tm-hero-kicker{display:inline-block;background:var(--accent);color:#000;font-weight:900;font-size:11px;letter-spacing:.1em;padding:3px 10px;border:2px solid #000;transform:rotate(-2deg);margin-bottom:14px}
.tm-hero-title{font-family:var(--font-display);font-weight:400;font-size:clamp(2.1rem,10vw,3.3rem);line-height:1.25;margin:0;text-shadow:3px 3px 0 rgba(0,0,0,.3);font-synthesis:none}
.tm-hero-hl{display:inline-block;background:var(--accent);color:#000;padding:0 .3em;border:2px solid #000;transform:rotate(-1.5deg);text-shadow:none;box-shadow:3px 3px 0 #000}
.tm-hero-sub{margin:14px 0 16px;font-size:.84rem;line-height:1.9;font-weight:700;max-width:30rem}
.tm-hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.tm-btn-primary,.tm-btn-ghost{cursor:pointer;font-weight:900;font-size:.88rem;padding:.6rem .85rem;color:#000;border:3px solid #000;border-radius:8px;box-shadow:4px 4px 0 #000;transition:transform .12s,box-shadow .12s}
.tm-btn-primary{background:var(--accent)}.tm-btn-ghost{background:#fff}
.tm-btn-primary:active,.tm-btn-ghost:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
.tm-hero-stub{position:relative;flex:0 0 68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 6px;background:var(--accent);color:#000;border-right:3px dashed #000}
.tm-hero-stub::before,.tm-hero-stub::after{content:"";position:absolute;right:-14px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.tm-hero-stub::before{top:-15px}.tm-hero-stub::after{bottom:-15px}
.tm-stub-top{writing-mode:vertical-rl;font-family:var(--font-serif);font-size:1.15rem;letter-spacing:.16em;line-height:1}
.tm-stub-emoji{font-size:2rem;animation:tmWobble 3s ease-in-out infinite}

.tm-marquee{flex:1 1 100%;order:3;overflow:hidden;background:#000;color:var(--accent);border-top:3px solid #000;direction:ltr;white-space:nowrap;padding:6px 0;font-family:var(--font-serif);font-size:15px;letter-spacing:.14em}

/* ===== inner pages (detail, seasons, downloads, lists) ===== */

main button.rounded-xl:not(.bg-black *){border:2px solid var(--ink)!important;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s}
main button.rounded-xl:not(.bg-black *):active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
main button[style*="color-mix(in srgb, var(--primary)"]:not(.bg-black *){background:var(--primary)!important;color:#fff!important}
button[title^="دانلود"]{background:var(--primary)!important;color:#fff!important;border:2px solid var(--ink)!important}

/* detail: action row */

.pb-10>.flex.items-center.justify-between.gap-3.mb-4>button:first-child{flex:0 0 auto;padding:.6rem .85rem!important}

/* detail: hero card */

.relative.rounded-\[20px\]::before{content:"";position:absolute;top:-13px;left:50%;width:78px;height:24px;background:color-mix(in srgb,var(--accent) 88%,transparent);border:2px solid #000;transform:translateX(-50%) rotate(4deg);z-index:2}
.relative.rounded-\[20px\] img{border-radius:3px!important}
.pb-10 h1{text-shadow:3px 3px 0 color-mix(in srgb,var(--primary) 85%,transparent)}
.w-full.max-w-3xl.leading-8{position:relative;background:var(--surface)!important;border:2px solid var(--ink)!important;box-shadow:5px 5px 0 var(--ink);padding-top:2.6rem!important}
.w-full.max-w-3xl.leading-8::before{content:"📄 خلاصه و اطلاعات";position:absolute;top:0;right:0;background:var(--accent);color:#000;font-weight:900;font-size:.72rem;line-height:1;padding:.5rem .9rem;border-bottom:2px solid #000;border-left:2px solid #000}

/* detail: quality tickets */
.w-full.max-w-3xl.mt-4>h3{display:inline-block;background:var(--accent);color:#000!important;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:.1em .8em .15em;transform:rotate(-1.5deg);font-family:var(--font-display);font-weight:400!important;font-size:1.1rem!important;margin-bottom:16px!important;font-synthesis:none}

.w-full.max-w-3xl.mt-4>.flex.flex-wrap.gap-2>span{display:flex;width:100%;gap:0;border:2px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:var(--surface)}
.w-full.max-w-3xl.mt-4>.flex.flex-wrap.gap-2>span>button:first-child{flex:1;justify-content:flex-start;border:0!important;border-radius:0!important;box-shadow:none!important;padding:.95rem 1rem!important;font-size:.95rem!important}
.w-full.max-w-3xl.mt-4>.flex.flex-wrap.gap-2>span>button:last-child{width:58px;height:auto!important;align-self:stretch;border:0!important;border-radius:0!important;border-right:2px dashed var(--ink)!important;box-shadow:none!important}

/* seasons / episodes */
.max-w-4xl.mt-3>.rounded-2xl.overflow-hidden{border:3px solid var(--ink)!important;box-shadow:6px 6px 0 var(--ink);background:var(--surface)!important}
.max-w-4xl.mt-3>.rounded-2xl>div.cursor-pointer.select-none{background:var(--surface-2)!important;border-bottom:0!important}
.max-w-4xl.mt-3 span.text-base.font-black{display:inline-block;background:var(--primary);color:#fff!important;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:.05em .7em;transform:rotate(-1.5deg)}
.p-3\.5.border-b.flex.flex-col{background:var(--surface-2)!important;border-top:2px dashed var(--ink)!important;border-bottom:2px dashed var(--ink)!important}
.divide-y>*{border-color:color-mix(in srgb,var(--ink) 45%,transparent)!important;border-style:dashed!important}
.min-w-\[2\.6rem\]{border:2px solid var(--ink);border-radius:6px!important;box-shadow:2px 2px 0 var(--ink);transform:rotate(-4deg)}
.flex.flex-wrap.gap-2.pr-0>span.inline-flex{gap:0!important;border:2px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.flex.flex-wrap.gap-2.pr-0>span.inline-flex>button{border:0!important;border-radius:0!important;box-shadow:none!important}
.flex.flex-wrap.gap-2.pr-0>span.inline-flex>button:last-child{border-right:2px dashed var(--ink)!important}

/* ===== structure: dock, detail order, info ===== */
.sticky.top-16{position:fixed!important;top:auto!important;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;z-index:40;border:3px solid var(--ink)!important;border-radius:14px;box-shadow:5px 5px 0 var(--ink);background:var(--surface-solid)!important}
.sticky.top-16>div{padding-top:.45rem!important;padding-bottom:.45rem!important}
main{padding-bottom:120px!important}
.w-full.max-w-3xl.mt-4{order:2}
.tm-info{order:3;width:100%;max-width:48rem;text-align:right}
.tm-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.tm-fact{margin:0;padding:.55rem .75rem .6rem;background:var(--surface);border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink)}
.tm-fact:nth-child(odd){transform:rotate(-.6deg)}.tm-fact:nth-child(even){transform:rotate(.5deg)}
.tm-fact-wide{grid-column:1/-1}
.tm-fact dt{font-size:.66rem;font-weight:900;letter-spacing:.04em;color:var(--primary-bright);margin:0 0 2px}
.tm-fact dd{margin:0;font-size:.86rem;font-weight:800;line-height:1.7;color:var(--text)}
.tm-plot{position:relative;background:var(--surface);border:2px dashed var(--ink);border-radius:8px;padding:2.4rem 1rem 1rem}
.tm-plot-label{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#000;font-weight:900;font-size:.72rem;line-height:1;padding:.5rem .9rem;border:2px solid #000;border-radius:8px 0 8px 0}
.tm-plot-text{margin:0;font-size:.9rem;line-height:2.05;font-weight:600;color:var(--text-2)}
.tm-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.tm-more{position:absolute;opacity:0;pointer-events:none}
.tm-more:checked~.tm-clamp{-webkit-line-clamp:unset;display:block}
.tm-more-btn{display:inline-block;margin-top:10px;cursor:pointer;background:var(--primary);color:#fff;font-weight:900;font-size:.75rem;padding:.4rem .9rem;border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink)}
.tm-more-btn::before{content:"ادامه‌ی خلاصه ▾"}
.tm-more:checked~.tm-more-btn::before{content:"بستن ▴"}

/* choose-player modal */
.z-\[99999\] .rounded-3xl{border:3px solid var(--ink)!important;box-shadow:7px 7px 0 var(--ink)}
.z-\[99999\] button{border:2px solid var(--ink)!important;border-radius:8px!important;box-shadow:3px 3px 0 var(--ink);background-color:var(--surface-2)!important;transition:transform .1s,box-shadow .1s}
.z-\[99999\] button:active{transform:translate(3px,3px);box-shadow:none}
.z-\[99999\] button[style*="--tm-fill"],.z-\[99999\] button[style*="color-mix(in srgb, var(--primary)"]{background:var(--primary)!important;color:#fff!important}
.tm-info{margin-top:18px}
/* ===== player ===== */
.fixed.inset-0.z-50.bg-black{--ink:#f6efdc;--bg:#100e0c;--surface:#1b1814;--surface-solid:#1b1814;--surface-2:#26221c;--text:#f6efdc;--text-2:#eadfc6;--secondary:#f6efdcb3;--border:#f6efdc26;--border-strong:#f6efdc55;font-family:var(--font-sans)}
.fixed.inset-0.z-50.bg-black [class*="backdrop-blur"]{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.fixed.inset-0.z-50.bg-black>div:first-child:not(.grow){background:var(--bg)!important;border-bottom:3px solid var(--ink)}
.fixed.inset-0.z-50.bg-black button{border:2px solid var(--ink)!important;border-radius:8px!important;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.fixed.inset-0.z-50.bg-black button:active{transform:translate(2px,2px);box-shadow:none}
.fixed.inset-0.z-50.bg-black button.bg-white\/10{background:#26221c!important;color:var(--text)!important}
.fixed.inset-0.z-50.bg-black button[style*="255, 69, 58"]{background:var(--primary)!important;color:#fff!important}
.fixed.inset-0.z-50.bg-black button[style*="color-mix(in srgb, var(--primary)"]{background:var(--primary)!important;color:#fff!important}
.fixed.inset-0.z-50.bg-black .w-20.h-20.rounded-full{border-radius:18px!important;border:4px solid var(--ink)!important;background:var(--primary)!important;box-shadow:6px 6px 0 var(--ink)!important}
.fixed.inset-0.z-50.bg-black .absolute.bottom-0.left-0.right-0.z-20{background:color-mix(in srgb,#0b0908 80%,transparent)!important;border-top:3px solid var(--ink)}
.fixed.inset-0.z-50.bg-black .py-3.cursor-pointer.mb-1>.relative.rounded-full{height:16px!important;border:2px solid var(--ink);border-radius:4px!important;background:#000!important}
.fixed.inset-0.z-50.bg-black .py-3.cursor-pointer.mb-1 .rounded-full{border-radius:2px!important}
.fixed.inset-0.z-50.bg-black .py-3.cursor-pointer.mb-1 .bg-white{border-radius:4px!important;background:var(--accent)!important;border:2px solid #000!important;width:14px!important;height:30px!important;box-shadow:2px 2px 0 #000}
.fixed.inset-0.z-50.bg-black .rounded-lg{border:2px solid var(--ink)!important;border-radius:6px!important}
.fixed.inset-0.z-50.bg-black .max-h-\[65\%\]{background:var(--surface-solid)!important;border-top:3px solid var(--ink)!important;border-radius:14px 14px 0 0!important}
.fixed.inset-0.z-50.bg-black .grow.overflow-y-auto{background:var(--bg)!important;border-top:3px solid var(--ink)!important}
.fixed.inset-0.z-50.bg-black .grow.overflow-y-auto button.rounded-2xl{border-radius:8px!important;box-shadow:4px 4px 0 var(--ink)}
.fixed.inset-0.z-50.bg-black .w-11.h-11.rounded-xl{border-radius:8px!important;border:2px solid var(--ink)}
.fixed.inset-0.z-50.bg-black h3,.fixed.inset-0.z-50.bg-black h4{font-family:var(--font-display);font-weight:400}

main span.rounded-full[style*="color-mix(in srgb, var(--primary)"]:not(.bg-black *){background:var(--accent)!important;color:#000!important;border:2px solid #000!important;border-radius:4px!important;transform:rotate(2deg)}
/* list pages: header, rows */
.mb-5.p-3.rounded-2xl.border>h2{flex:0 1 auto!important;background:var(--primary);color:#fff!important;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:.05em .75em .12em;transform:rotate(-1deg);font-size:1.1rem}
.mb-5.p-3.rounded-2xl.border>span.tabular-nums{background:var(--accent)!important;color:#000!important;border:2px solid #000!important;box-shadow:2px 2px 0 #000;transform:rotate(2deg);border-radius:4px!important}
main button.rounded-2xl:not(.bg-black *),main button.rounded-3xl:not(.bg-black *){border:2px solid var(--ink)!important;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
main button.rounded-2xl:not(.bg-black *):active,main button.rounded-3xl:not(.bg-black *):active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

</style>
